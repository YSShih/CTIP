# 共用設定(docs/spec/05-environment.md §5.7,強制對應)。
# 環境變數 → Spring property 的唯一對應點;profile 差異在 application-{mvp,dev,staging,prod}.yml。
spring:
  application:
    name: ctip
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    # 應用執行期以**非特權**角色連線;Flyway 另以 owner 連線跑 DDL(下方 spring.flyway.*)。
    # 理由:POSTGRES_USER 是 postgres image 的初始 superuser,而 superuser 繞過所有
    # GRANT/REVOKE ——M3-09「audit_logs 的 UPDATE/DELETE 必須被 DB 拒絕」在單一 superuser
    # 連線下永遠不可能通過(ADR 0021)。
    username: ${POSTGRES_APP_USER:${POSTGRES_USER}}
    password: ${POSTGRES_APP_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    open-in-view: false # 強制:避免 lazy loading 洩漏到 view 層
    hibernate:
      ddl-auto: validate # 強制:schema 由 Flyway 管理
  flyway:
    enabled: true
    locations: classpath:db/migration
    # migration 需要 DDL 與擴充權限,以 owner 連線;應用執行期則是上面的非特權角色
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  # 反向代理下的真實 client IP(10 §10.7 強制)。信任來源由 ctip.proxy.trusted 限定——
  # 只設 framework 而不限定來源等於任何人都能自稱來自任意 IP,匿名限流的 IP 維度即失效。
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSED_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

ctip:
  environment: ${ENVIRONMENT}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000}
    # 輪替家族的絕對存活上限(§10.4 未定義,ADR 0013)。刻意不開環境變數:
    # compose 與 .env 樣板不宣告的變數不得在此使用(§5.5 對稱性),同 security 段。
    refresh-token-family-max-days: 90
  security:
    # 不變量 U7(10 §10.4 明定為固定值:連續失敗 10 次 → 鎖定 15 分鐘)。
    # 刻意不開環境變數:compose 與 .env 樣板不宣告的變數不得在此使用(§5.5 對稱性)。
    login-max-failed-attempts: 10
    login-lock-minutes: 15
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    backend: ${RATE_LIMIT_BACKEND:redis}
  proxy:
    # 逗號分隔的 CIDR / 單一位址;空 = 不採信任何 X-Forwarded-*(見 docs/deployment/rate-limiting.md)
    trusted: ${TRUSTED_PROXIES:}
  plan:
    # 方案配額一律讀 plans 表(10-identity-plans.md §10.6)。部署期覆寫以單一 JSON 變數承載,
    # 例:{"PREMIUM":{"maxApiKeys":20}}。逐項環境變數的命名慣例綁不到屬性(ADR 0019)。
    overrides: ${CTIP_PLAN_OVERRIDES:}
  ingestion:
    enabled: ${INGESTION_ENABLED:true}
    batch-size: ${INGESTION_BATCH_SIZE:500}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    # 各任務 cron 皆可由環境變數覆寫(docs/spec/08-ingestion-sdk.md §8.7)
    source-sync-cron: "${SOURCE_SYNC_CRON:0 */5 * * * *}"
    ioc-expiry-cron: "${IOC_EXPIRY_CRON:0 0 3 * * *}"
    ingestion-retry-cron: "${INGESTION_RETRY_CRON:0 */15 * * * *}"
  normalization:
    strip-www: ${NORMALIZATION_STRIP_WWW:false}
  api:
    # 預設分頁大小(09 §9.3);上限與批次上限依方案查 plans 表,不在此宣告
    default-page-size: ${API_DEFAULT_PAGE_SIZE:50}
  data-quality:
    domain-allowlist: ${DOMAIN_ALLOWLIST:}
  bloom:
    public-capacity: ${BLOOM_PUBLIC_CAPACITY:10000000}
    public-false-positive-rate: ${BLOOM_PUBLIC_FALSE_POSITIVE_RATE:0.001}
    tenant-default-capacity: ${BLOOM_TENANT_DEFAULT_CAPACITY:1000000}
    snapshot-cron: "${BLOOM_SNAPSHOT_CRON:0 0 4 * * *}"
    delta-cron: "${BLOOM_DELTA_CRON:0 0 * * * *}"
    max-delta-chain: ${BLOOM_MAX_DELTA_CHAIN:24}
    # artifact 根目錄(容器內由具名 volume bloom-data 掛載);資料庫存的是相對於它的路徑
    storage-dir: ${BLOOM_STORAGE_DIR:/var/lib/ctip/bloom}
    compression: ${BLOOM_COMPRESSION:ZSTD}
  retention:
    audit-days: ${AUDIT_RETENTION_DAYS:180}
    raw-payload-days: ${RAW_PAYLOAD_RETENTION_DAYS:30}
    rejection-days: ${REJECTION_RETENTION_DAYS:30}
    delivery-days: ${DELIVERY_RETENTION_DAYS:30}
    indicator-days: ${INDICATOR_RETENTION_DAYS:365}
    bloom-artifact-keep: ${BLOOM_ARTIFACT_KEEP:30}

# traceId 進日誌(09 §9.4:錯誤回應的 traceId 必須與日誌可對應;TraceIdFilter 設定 MDC)
logging:
  pattern:
    correlation: "[%X{traceId:-}] "
