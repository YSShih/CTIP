# mvp profile:載入 db/seed/ 開發樣本資料(docs/spec/05-environment.md §5.9)。
spring:
  sql:
    init:
      mode: always
      data-locations: classpath:db/seed/sample_data.sql
  devtools:
    restart:
      # ADR 0010:只在 reload.sh 觸碰 trigger file 時重啟,host 端建置不再觸發(避免半寫入 classpath)
      trigger-file: .reloadtrigger

# mvp 的 compose 不啟動 redis(§5.5:redis 屬 standard/full profile),而 spring-boot-data-redis
# 一在 classpath 上,actuator 就會加一個 redis 健康檢查——沒有 redis 的 mvp 會永遠 DOWN,
# 容器 healthcheck 因此永遠 unhealthy、depends_on 卡死。mvp 的限流後端本來就是 memory。
management:
  health:
    redis:
      enabled: false
    # 同理:spring-boot-elasticsearch 一在 classpath 上,actuator 就會加一個 ES 健康檢查。
    # es 只屬 full profile(§5.5),mvp/dev 都沒有它——不關掉容器永遠 unhealthy(13 §13.7、06 §6.3.6)。
    elasticsearch:
      enabled: false
