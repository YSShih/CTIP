# Maven package、Vite build、SBOM 產出(13 §13.8;規格標 M1,Phase 23 補齊)
# SBOM 是建置產物而非版控檔案(DoD M3-20 只檢查存在性):
# backend 由 CycloneDX maven plugin 於 package 階段產生,frontend 由 `npm sbom` 產生。
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven package(不跑測試,測試在 backend-test)
        run: ./backend/mvnw -f backend/pom.xml -B -DskipTests package

      # 聚合 BOM 落在 reactor 根(backend/target/);各 module 另有自己的一份與嵌入 jar 的 META-INF/sbom/
      - name: CycloneDX 聚合 SBOM 必須產出(M3-20)
        run: test -s backend/target/bom.json

      - name: 上傳 jar 與 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/ctip-app/target/*.jar
            backend/ctip-sdk/target/*.jar
            backend/target/bom.json

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Vite build(build script 內含 tsc --noEmit)
        run: npm run build

      - name: npm SBOM(M3-20)
        run: npm run sbom && test -s sbom.json

      - name: 上傳靜態產物與 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend/dist/
            frontend/sbom.json
