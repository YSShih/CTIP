# ESLint、Prettier check、tsc --noEmit、Vitest(13 §13.8;規格標 M1,Phase 23 補齊)
name: frontend-test

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci(06 §6.1.2:CI 一律用 lockfile)
        run: npm ci

      - name: ESLint(含 §12.2 feature 依賴規則)
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test
