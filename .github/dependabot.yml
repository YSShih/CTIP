# 相依更新(13 §13.8、06 §6.1.3 規則 3):patch/minor 自動開 PR、major 需人工審核。
#
# ⚠️ 依 06 §6.1.2,**Coding LLM 不得自行合併版本升級 PR**——本檔只負責「開 PR」,
#    合併一律由人決定;major 升級另須寫 ADR。
#
# 同時作為 §6.2.3b「相依弱點:OWASP Dependency-Check 或 Dependabot alerts 二擇一」
# 的選項:本專案選 Dependabot(alerts 於 repo 設定啟用),
# CI 端的可失敗訊號由 .github/workflows/security.yml 的 Trivy fs 掃描提供。
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    ignore:
      # major 不自動開 PR:需人工核准並寫 ADR(06 §6.1.2)
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # 06 §6.2.2 的版本表把這兩項 pin 在 **minor 層級**(ArchUnit 1.4.x、Resilience4j 2.3.x),
      # 跨出 pin 要先改版本表並寫 ADR。不加這條的話 Dependabot 會反覆提同一個 minor 升版
      # ——實測:手動關閉後它換一個 patch 號重開一支新 PR(ADR 0049)。patch 仍會自動提出。
      # 升 minor 改在 06 §6.4 的版本複查日(2027-02-21)一併評估。
      - dependency-name: "com.tngtech.archunit:*"
        update-types: [version-update:semver-minor]
      - dependency-name: "io.github.resilience4j:*"
        update-types: [version-update:semver-minor]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # 同 maven 區塊:06 §6.2.3 把 ESLint pin 在 10.8.x、TanStack Query 在 5.101.x,
      # 且 package.json 用 `~` 本來就鎖 minor。實測 Dependabot 會反覆重開(#8 關掉後
      # 換 5.102.7 重開為 #15),因此以 ignore 表達版本表的 pin(ADR 0049)。patch 仍會提出。
      - dependency-name: "eslint"
        update-types: [version-update:semver-minor]
      - dependency-name: "@tanstack/react-query"
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    ignore:
      # 與 maven / npm / docker 一致:major 不自動開 PR,需人工核准並寫 ADR(06 §6.1.2)。
      # 本區塊原本**漏了這一條**——檔案開頭寫著「major 需人工審核」,另外三個 ecosystem 都實作了,
      # 只有這裡沒有,於是 setup-node 4→7、setup-java 4→6、upload-artifact 4→7、
      # docker/build-push-action 6→7、docker/metadata-action 5→6 自動開了五支 PR(ADR 0049)。
      # 跨 major 會改變輸入參數與 runtime,必須看過 release note;升版改在 06 §6.4 的複查日手動做。
      #
      # 這條**不影響**安全掃描類 action 的 SHA-pin 規則(06 §6.2.3b):
      # Gitleaks / Trivy 釘的是 commit SHA、不用浮動 tag,是另一回事。
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories:
      - /environment/docker/backend
      - /environment/docker/frontend
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # nginx 只用 **stable 分支(偶數 minor)**(06 §6.2:「上游有 LTS 或 stable 分支制度時
      # 必須 pin 該分支」;00 §0.6 修正 v1.1 的理由逐字是「1.29 是 mainline(奇數 minor)且已退役」)。
      #
      # Dependabot 無法表達「只接受偶數 minor」,而 tag 是浮動的 `1.30-alpine`——
      # 它唯一會提的就是 minor(1.31、1.32…),其中奇數是 mainline、不得使用。
      # 實測:PR #1 提了 1.31-alpine(mainline),已依本規則關閉。
      #
      # 因此 minor 一併忽略,改由 06 §6.4 的版本複查程序手動升到下一個 **stable**(1.32-alpine)。
      # 代價是 stable 分支內的安全修補不會自動開 PR——但 `1.30-alpine` 本身就是浮動 tag,
      # 每次 docker build 都會拉到該分支最新的 patch,而 security.yml 的 Trivy image 掃描會擋住漏網的。
      - dependency-name: "nginx"
        update-types: [version-update:semver-minor]
