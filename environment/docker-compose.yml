# CTIP 唯一的 compose 檔(docs/spec/05-environment.md §5.6,強制契約)。
# 環境差異一律透過環境變數與 Compose profiles 控制,禁止建立 docker-compose.<env>.yml。
name: ${PROJECT_NAME:-ctip}

x-app-common: &app-common
  restart: ${RESTART_POLICY:-unless-stopped}
  networks: [ ctip ]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  backend:
    <<: *app-common
    build:
      context: ..
      dockerfile: environment/docker/backend/Dockerfile
      target: ${BACKEND_BUILD_TARGET:-production}
    environment:
      ENVIRONMENT:                    ${ENVIRONMENT:?ENVIRONMENT is required}
      SPRING_PROFILES_ACTIVE:         ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS:              ${BACKEND_JAVA_OPTS:-}
      SERVER_PORT:                    ${BACKEND_PORT:-8080}
      POSTGRES_HOST:                  ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT:                  ${POSTGRES_PORT:-5432}
      POSTGRES_DB:                    ${POSTGRES_DB:?}
      POSTGRES_USER:                  ${POSTGRES_USER:?}
      POSTGRES_PASSWORD:              ${POSTGRES_PASSWORD:?}
      # 應用執行期以非特權角色連線;Flyway 另以 owner 連線跑 DDL(ADR 0021)
      POSTGRES_APP_USER:           ${POSTGRES_APP_USER:-ctip_app}
      POSTGRES_APP_PASSWORD:       ${POSTGRES_APP_PASSWORD:?}
      REDIS_HOST:                     ${REDIS_HOST:-redis}
      REDIS_PORT:                     ${REDIS_PORT:-6379}
      REDIS_PASSWORD:                 ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS:        ${KAFKA_BOOTSTRAP_SERVERS:-}
      ELASTICSEARCH_URL:              ${ELASTICSEARCH_URL:-}
      ELASTICSEARCH_USERNAME:         ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD:         ${ELASTICSEARCH_PASSWORD:-}
      JWT_SECRET:                     ${JWT_SECRET:?}
      JWT_ACCESS_TOKEN_EXPIRATION:    ${JWT_ACCESS_TOKEN_EXPIRATION:-900}
      JWT_REFRESH_TOKEN_EXPIRATION:   ${JWT_REFRESH_TOKEN_EXPIRATION:-2592000}
      CORS_ALLOWED_ORIGINS:           ${CORS_ALLOWED_ORIGINS:?}
      SWAGGER_ENABLED:                ${SWAGGER_ENABLED:-false}
      ACTUATOR_EXPOSED_ENDPOINTS:     ${ACTUATOR_EXPOSED_ENDPOINTS:-health,info}
      RATE_LIMIT_ENABLED:             ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_BACKEND:             ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_ANONYMOUS_PER_MINUTE: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:-60}
      RATE_LIMIT_ANONYMOUS_PER_DAY:   ${RATE_LIMIT_ANONYMOUS_PER_DAY:-1000}
      SCHEDULER_ENABLED:              ${SCHEDULER_ENABLED:-true}
      SOURCE_SYNC_CRON:               ${SOURCE_SYNC_CRON:-0 */5 * * * *}
      IOC_EXPIRY_CRON:                ${IOC_EXPIRY_CRON:-0 0 3 * * *}
      INGESTION_RETRY_CRON:           ${INGESTION_RETRY_CRON:-0 */15 * * * *}
      INGESTION_ENABLED:              ${INGESTION_ENABLED:-true}
      INGESTION_BATCH_SIZE:           ${INGESTION_BATCH_SIZE:-500}
      NORMALIZATION_STRIP_WWW:        ${NORMALIZATION_STRIP_WWW:-false}
      DOMAIN_ALLOWLIST:               ${DOMAIN_ALLOWLIST:-}
      STIX_EXPORT_MAX_OBJECTS:        ${STIX_EXPORT_MAX_OBJECTS:-1000}
      API_DEFAULT_PAGE_SIZE:          ${API_DEFAULT_PAGE_SIZE:-50}
      API_MAX_PAGE_SIZE:              ${API_MAX_PAGE_SIZE:-50}
      API_MAX_BATCH_LOOKUP:           ${API_MAX_BATCH_LOOKUP:-20}
      BLOOM_PUBLIC_CAPACITY:          ${BLOOM_PUBLIC_CAPACITY:-10000000}
      BLOOM_PUBLIC_FALSE_POSITIVE_RATE: ${BLOOM_PUBLIC_FALSE_POSITIVE_RATE:-0.001}
      BLOOM_TENANT_DEFAULT_CAPACITY:  ${BLOOM_TENANT_DEFAULT_CAPACITY:-1000000}
      BLOOM_SNAPSHOT_CRON:            ${BLOOM_SNAPSHOT_CRON:-0 0 4 * * *}
      BLOOM_DELTA_CRON:               ${BLOOM_DELTA_CRON:-0 0 * * * *}
      BLOOM_MAX_DELTA_CHAIN:          ${BLOOM_MAX_DELTA_CHAIN:-24}
      BLOOM_STORAGE_DIR:              ${BLOOM_STORAGE_DIR:-/var/lib/ctip/bloom}
      BLOOM_COMPRESSION:              ${BLOOM_COMPRESSION:-ZSTD}
      AUDIT_RETENTION_DAYS:           ${AUDIT_RETENTION_DAYS:-180}
      RAW_PAYLOAD_RETENTION_DAYS:     ${RAW_PAYLOAD_RETENTION_DAYS:-30}
      REJECTION_RETENTION_DAYS:       ${REJECTION_RETENTION_DAYS:-30}
      DELIVERY_RETENTION_DAYS:        ${DELIVERY_RETENTION_DAYS:-30}
      INDICATOR_RETENTION_DAYS:       ${INDICATOR_RETENTION_DAYS:-365}
      BLOOM_ARTIFACT_KEEP:            ${BLOOM_ARTIFACT_KEEP:-30}
      DELIVERY_CLEANUP_CRON:          ${DELIVERY_CLEANUP_CRON:-0 10 2 * * *}
      INDICATOR_CLEANUP_CRON:         ${INDICATOR_CLEANUP_CRON:-0 20 2 * * *}
    volumes:
      # Bloom artifact 是檔案(04 表 23 的 storage_kind=FILESYSTEM、storage_path NOT NULL);
      # 沒有這個 volume 時,每次容器重建就全部消失(ADR 0019)
      - bloom-data:${BLOOM_STORAGE_DIR:-/var/lib/ctip/bloom}
      - ${BACKEND_MOUNT_SRC:-./.noop}:${BACKEND_MOUNT_DST:-/opt/noop}:${BACKEND_MOUNT_MODE:-ro}
      - ${MAVEN_CACHE_SRC:-maven-cache}:${MAVEN_CACHE_DST:-/opt/noop-m2}
    ports:
      - "${BACKEND_BIND:-127.0.0.1:8080}:8080"
      - "${BACKEND_DEBUG_BIND:-127.0.0.1:5005}:5005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    <<: *app-common
    build:
      context: ..
      dockerfile: environment/docker/frontend/Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-production}
    environment:
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:?}
      VITE_API_URL:     ${VITE_API_URL:?}
      VITE_WS_URL:      ${VITE_WS_URL:-}
    volumes:
      - ${FRONTEND_MOUNT_SRC:-./.noop}:${FRONTEND_MOUNT_DST:-/opt/noop}:${FRONTEND_MOUNT_MODE:-ro}
      # dev 掛 node-modules volume 遮罩 host 的 node_modules(macOS 原生 binding 進 Linux
      # 容器必失敗;ADR 0001 決策 5)。prod 依預設值退化為無害掛載,同 maven-cache 模式。
      - ${NODE_MODULES_SRC:-node-modules}:${NODE_MODULES_DST:-/opt/noop-node-modules}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:3000}:${FRONTEND_CONTAINER_PORT:-80}"
    depends_on: [ backend ]

  postgres:
    <<: *app-common
    image: postgres:18-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?}
      POSTGRES_USER:     ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # 供 initdb 的 01-app-roles.sh 建立非特權角色(ADR 0021)
      POSTGRES_APP_USER:           ${POSTGRES_APP_USER:-ctip_app}
      POSTGRES_APP_PASSWORD:       ${POSTGRES_APP_PASSWORD:?}
      POSTGRES_RETENTION_USER:     ${POSTGRES_RETENTION_USER:-ctip_retention}
      POSTGRES_RETENTION_PASSWORD: ${POSTGRES_RETENTION_PASSWORD:?}
    volumes:
      # postgres:18+ 要求掛載點為 /var/lib/postgresql(掛 …/data 會拒絕啟動;ADR 0001 決策 4)
      - postgres-data:/var/lib/postgresql
      - ./config/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *app-common
    profiles: [ "standard", "full" ]
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_BIND:-127.0.0.1:6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    <<: *app-common
    profiles: [ "full" ]
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    # 沒有 healthcheck 時,up.sh 只能看容器是否 running,無法判斷 broker 是否真的可用
    # ——依賴它的服務會在「已啟動但還沒 ready」的窗口失敗(ADR 0018)
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  elasticsearch:
    <<: *app-common
    profiles: [ "full" ]
    image: elasticsearch:9.5.1
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      xpack.security.enabled: ${ES_SECURITY_ENABLED:-false}
      # security 開啟時 ES 需要 elastic 使用者的密碼;沒給的話它會自動產生並只印在日誌裡,
      # 而 healthcheck 與應用都拿不到 → 容器 healthy 不了(ADR 0018)
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # security 關閉時不帶憑證;開啟時必須帶,否則 _cluster/health 回 401
      test: ["CMD-SHELL", "curl -fsS ${ELASTIC_PASSWORD:+-u elastic:$$ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  prometheus:
    <<: *app-common
    profiles: [ "full" ]
    image: prom/prometheus:v3.6.0
    volumes:
      - ./config/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    <<: *app-common
    profiles: [ "full" ]
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
    volumes:
      - ./config/monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

networks:
  ctip:
    driver: bridge

volumes:
  bloom-data:
  postgres-data:
  redis-data:
  kafka-data:
  es-data:
  prometheus-data:
  grafana-data:
  maven-cache:
  node-modules:
