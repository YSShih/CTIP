# CTIP frontend — nginx 設定(production stage 使用)
# 安全標頭依 docs/spec/13-platform-ops.md §13.3;
# Strict-Transport-Security 依規格由反向代理層設定,不在此重複。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 安全標頭 ----------
    # SPA 僅載入自身打包資產;API 走 fetch(connect-src),允許 https/wss 供
    # VITE_API_URL / VITE_WS_URL 指向的後端網域。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # 不洩漏 nginx 版本
    server_tokens off;

    # ---------- 壓縮 ----------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---------- 靜態資產快取 ----------
    # 用 expires 而非 add_header 設快取:location 內一旦出現 add_header,
    # 會整組遮蔽 server 層的安全標頭(nginx 繼承規則)。
    # Vite build 產物含 content hash,可長快取
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html 不快取,確保部署後立即取得新版
    location = /index.html {
        expires -1;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
